schema_version = "1.1"
artifacts = ["/logs/artifacts/model.patch"]

[task]
name = "authored/etlplus-pipeline"
description = "The nightly orders export switched from JSON to chunked CSV: etlplus pipeline jobs must give the same results on the CSV as on the same records in JSON."
authors = []
keywords = ["python", "data-processing", "pipeline", "etlplus", "csv"]

[metadata]
task_id = "etlplus-pipeline"
display_title = "ETLPlus jobs on the new CSV orders export"
repository_url = "https://github.com/Dagitali/ETLPlus.git"
base_commit_hash = "36527c8c712fa3ba3b88882a497c70d5faaf1374"
language = "python"
category = "data_processing"
archetype = "pipeline"

[verifier]
environment_mode = "separate"
# At least 3x one full grade (both suites) on 4 CPUs, and never below 1800.
timeout_sec = 1800

[[verifier.collect]]
command = "bash -lc 'cd /app && mkdir -p /logs/artifacts && git config --global --add safe.directory /app 2>/dev/null || true; git add -A 2>/dev/null || true; git diff --binary --cached 36527c8c712fa3ba3b88882a497c70d5faaf1374 > /logs/artifacts/model.patch'"
service = "main"
timeout_sec = 60

[environment]
allow_internet = false
build_timeout_sec = 2400
cpus = 4
memory_mb = 8192
storage_mb = 20480
gpus = 0

[agent]
timeout_sec = 21600
