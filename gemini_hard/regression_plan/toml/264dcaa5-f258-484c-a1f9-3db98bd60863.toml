# Single-container (shared) verifier: grading runs in the agent's OWN container after the
# agent phase, so there is no separate verifier image. The repository's own suite is kept
# out of the agent's tree during its phase (environment/Dockerfile removes it) and restored
# at grade time by tests/grade.py from the root-owned /tests mount, so the "no test suite"
# premise still holds inside one container. The grader runs as root (user below) so it can
# read /tests and restore the suite; the tree under test still runs as the agent account
# (answer_key run_tests_as = "agent"); and the seal in the grader neutralizes .git so root
# git obeys nothing the agent planted (the shared-container exposure the separate verifier
# used to close by isolation). environment_mode="shared" is incompatible with a
# [verifier.environment] block, so that block is intentionally absent; the verifier
# inherits the agent's environment.
[verifier]
environment_mode = "shared"
user = "root"
timeout_sec = 2400.0
[[verifier.collect]]
command = "bash -c 'mkdir -p /logs/artifacts && cd /workspace/repo && tar czf /logs/artifacts/worktree.tgz --exclude=./.git . ; cp -f /app/rca.json /logs/artifacts/rca.json 2>/dev/null || true ; cp -f /app/RESEARCH_AND_PLANNING.md /logs/artifacts/RESEARCH_AND_PLANNING.md 2>/dev/null || true'"
service = "main"
timeout_sec = 300

[agent]
timeout_sec = 21600.0

[environment]
network_mode = "no-network"
build_timeout_sec = 1800.0
os = "linux"
workdir = "/workspace/repo"
cpus = 2
memory_mb = 8192
storage_mb = 20480
gpus = 0
