schema_version = "1.1"
artifacts = ["/logs/artifacts/model.patch"]

[task]
name = "authored/pdk-redash-data-source-invalidation"
description = "Fence cached and scheduled Redash queries by durable data-source generations"
authors = []
keywords = ["python", "system-design", "cache-invalidation"]

[metadata]
task_id = "pdk-redash-data-source-invalidation"
display_title = "Durable Redash data source invalidation"
repository_url = "https://github.com/getredash/redash.git"
base_commit_hash = "e170795256ae028930e4760192e5dc3f59bb420c"
language = "python"
category = "system_design"

[verifier]
