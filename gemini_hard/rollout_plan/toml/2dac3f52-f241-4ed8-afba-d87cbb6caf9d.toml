schema_version = "1.1"
artifacts = ["/logs/artifacts/model.patch"]

[task]
name = "authored/verdaccio-uplink-refresh-without-clobbering"
description = "Shared-volume uplink cache coherence and bounded stale metadata"
authors = []
keywords = ["typescript", "system-design"]

[metadata]
task_id = "verdaccio-uplink-refresh-without-clobbering"
display_title = "Shared uplink refresh without clobbering"
repository_url = "https://github.com/verdaccio/verdaccio.git"
base_commit_hash = "45a44225e981c0d1dfd65bfdd8c059c32040cdd4"
language = "typescript"
category = "system_design"

[verifier]
environment_mode = "separate"
# At least 3x one full grade (both suites) on 4 CPUs; hidden suites wait out real outages, and
# Horizon's graders are slower than a build sandbox.
timeout_sec = 5400.0

# Collected as the solver's own user, with no external diff or textconv: git config or attributes
# the solver plants in /app would otherwise run as root here.
[[verifier.collect]]
command = "bash -lc 'cd /app && mkdir -p /logs/artifacts && git config --global --add safe.directory /app 2>/dev/null || true; git add -A 2>/dev/null || true; git diff --binary --no-ext-diff --no-textconv --cached 45a44225e981c0d1dfd65bfdd8c059c32040cdd4 > /logs/artifacts/model.patch'"
service = "main"
user = "agent"
timeout_sec = 60

[environment]
# Always false. A compose task attaches every service, main included, in both compose files to one
# network declared `internal: true`, so host names resolve but nothing reaches the internet.
allow_internet = false
build_timeout_sec = 5400.0
cpus = 4
memory_mb = 8192
storage_mb = 20480
gpus = 0

[agent]
# The solver runs unprivileged; the environment image keeps root as its default user. Multi-service
# work with real outages needs long test cycles, so the solver gets twelve hours.
user = "agent"
timeout_sec = 43200.0
