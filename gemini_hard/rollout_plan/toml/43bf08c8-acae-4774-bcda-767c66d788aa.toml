schema_version = "1.1"
artifacts = ["/logs/artifacts/model.patch"]

[task]
name = "authored/pdk-dagster-pool-slot-leases"
description = ""
authors = []
keywords = ["python", "system-design"]

[metadata]
task_id = "pdk-dagster-pool-slot-leases"
display_title = "Fenced leases for op pool slots"
repository_url = "https://github.com/dagster-io/dagster.git"
base_commit_hash = "ea313f0665515c94baf4739c9629c5ef0f214f0c"
language = "python"
category = "system_design"

[verifier]
environment_mode = "separate"
# At least 3x one full grade (both suites) on 4 CPUs; hidden suites wait out real outages, and
# Horizon's graders are slower than a build sandbox.
timeout_sec = 5400.0

[[verifier.collect]]
command = "bash -lc 'cd /app && mkdir -p /logs/artifacts && git config --global --add safe.directory /app 2>/dev/null || true; git add -A 2>/dev/null || true; git diff --binary --cached ea313f0665515c94baf4739c9629c5ef0f214f0c > /logs/artifacts/model.patch'"
service = "main"
timeout_sec = 60

[environment]
# Always false. A compose task attaches every service, main included, in both compose files to one
# network declared `internal: true`, so host names resolve but nothing reaches the internet.
allow_internet = false
build_timeout_sec = 5400.0
cpus = 4
memory_mb = 8192
storage_mb = 20480
gpus = 0

[agent]
# The solver runs unprivileged; the environment image keeps root as its default user. Multi-service
# work with real outages needs long test cycles, so the solver gets six hours.
user = "agent"
timeout_sec = 43200.0
