schema_version = "1.1"
artifacts = ["/logs/artifacts/model.patch"]

[task]
name = "authored/pdk-saleor-discounted-price-convergence"
description = "Convergent Saleor catalogue discounted prices across workers"
authors = []
keywords = ["python", "system-design", "django", "celery"]

[metadata]
task_id = "pdk-saleor-discounted-price-convergence"
display_title = "Reliable catalogue discounted prices"
repository_url = "https://github.com/saleor/saleor.git"
base_commit_hash = "bb75f87973abe24056a5d0dff1708ca097e95599"
language = "python"
category = "system_design"

[verifier]
environment_mode = "separate"
