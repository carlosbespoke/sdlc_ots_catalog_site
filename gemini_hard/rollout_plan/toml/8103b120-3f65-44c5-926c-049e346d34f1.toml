schema_version = "1.4"

[[artifacts]]
source = "/workspace/infra"
exclude = [".terraform", ".git", "*.tfstate", "*.tfstate.backup", "*.tfplan"]

[metadata]
difficulty = "hard"
category = "Infrastructure as Code"
tags = ["iac", "terraform", "aws", "migrate", "refactor"]
expert_time_estimate_minutes = 180
display_description = "Refactor a flat, count-indexed Terraform stack (130 AWS resources across 14 services) into network/database/functions/operations modules keyed by availability zone and API workload, with variables and outputs, so that the plan against the recorded production state is moves only"
source_repository = ""
source_commit = ""
source_license = ""
terraform_version = "1.16.4"
aws_provider_version = "5.100.0"
grading = "partial: 0 if any gate fails (static bans, offline init/validate/plan, moves-only plan, CI policies, no pasted IDs, remapped state), else passed/25 requirement checks"

[agent]
timeout_sec = 10800.0
user = "agent"
network_mode = "no-network"

[verifier]
timeout_sec = 1800.0
environment_mode = "separate"
network_mode = "no-network"
user = "root"

[verifier.environment]
build_timeout_sec = 1800.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
network_mode = "no-network"

[environment]
build_timeout_sec = 1800.0
memory_mb = 8192
cpus = 4
storage_mb = 20480
network_mode = "no-network"
workdir = "/workspace/infra"
gpus = 0
mcp_servers = []
