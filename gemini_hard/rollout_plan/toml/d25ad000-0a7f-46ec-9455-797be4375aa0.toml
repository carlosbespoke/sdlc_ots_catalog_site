schema_version = "1.1"
artifacts = ["/logs/artifacts/model.patch"]

[task]
name = "authored/activepieces-fenced-job-leases"
description = "Fence leased webhook flow jobs across api, worker, and engine"
authors = []
keywords = ["typescript", "system-design", "redis", "postgresql"]

[metadata]
task_id = "activepieces-fenced-job-leases"
display_title = "Fenced flow job leases"
repository_url = "https://github.com/activepieces/activepieces.git"
base_commit_hash = "f69620859abdc8c691f46b680786f34328992f2e"
language = "typescript"
category = "system_design"

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[[verifier.collect]]
command = "bash -lc 'cd /app && mkdir -p /logs/artifacts && git config --global --add safe.directory /app 2>/dev/null || true; git add -A 2>/dev/null || true; git diff --binary --cached f69620859abdc8c691f46b680786f34328992f2e > /logs/artifacts/model.patch'"
service = "main"
timeout_sec = 60

[environment]
allow_internet = false
build_timeout_sec = 2400
cpus = 4
memory_mb = 8192
storage_mb = 20480
gpus = 0

[agent]
user = "agent"
timeout_sec = 43200.0
