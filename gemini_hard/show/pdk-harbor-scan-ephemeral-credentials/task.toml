schema_version = "1.1"
artifacts = ["/logs/artifacts/model.patch"]

[task]
name = "authored/pdk-harbor-scan-ephemeral-credentials"
description = "Make Harbor scan credentials repository-scoped, renewable and absent from job queues"
authors = []
keywords = ["go", "system-design", "harbor", "registry"]

[metadata]
task_id = "pdk-harbor-scan-ephemeral-credentials"
display_title = "Ephemeral credentials for Harbor scanner jobs"
repository_url = "https://github.com/goharbor/harbor.git"
base_commit_hash = "b323c0c8ec897038a6090255cf9415e747e4730a"
language = "go"
category = "system_design"

[verifier]
environment_mode = "separate"
timeout_sec = 5400.0

[[verifier.collect]]
command = "bash -lc 'cd /app && mkdir -p /logs/artifacts && git config --global --add safe.directory /app 2>/dev/null || true; git add -A 2>/dev/null || true; git diff --binary --cached b323c0c8ec897038a6090255cf9415e747e4730a > /logs/artifacts/model.patch'"
service = "main"
timeout_sec = 60

[environment]
allow_internet = false
build_timeout_sec = 5400.0
cpus = 4
memory_mb = 8192
storage_mb = 20480
gpus = 0

[agent]
user = "agent"
timeout_sec = 43200.0
