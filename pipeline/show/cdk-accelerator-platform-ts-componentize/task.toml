schema_version = "1.4"

[[artifacts]]
source = "/workspace/accelerator-platform"
exclude = ["node_modules", "cdk.out", ".git"]

[metadata]
difficulty = "hard"
category = "Infrastructure as Code"
tags = ["iac", "aws-cdk", "typescript", "cloudformation", "aws", "refactor", "componentize"]
expert_time_estimate_minutes = 420
display_description = "Restructure a flat AWS CDK TypeScript accelerator app (three stacks and about 160 resources in production) into sixteen named construct classes with typed props and public properties, preserving every deployed and valid-configuration template: identical logical IDs and properties, with a component tag as the only change"
source_repository = "epam/aws-ci-cd-accelerator"
source_commit = "c966ee92317d10a98d74e81699d8b210f99920b5"
source_license = "Apache-2.0"
language = "typescript"
cdk_cli_version = "2.1144.0"
aws_cdk_lib_version = "2.272.0"
grading = "all-or-nothing: 0 if any gate fails (the files the solver must not change are unchanged, compile, code rules, synth through the grader's entry point, construct provenance, templates of the deployed environments equal to the expected ones: prod (158 resources), staging (120 resources)) or any of the 43 checks fails (16 component layouts with their resource ownership; 8 hidden configurations synthesized and compared the same way: 4 authored and 4 variants of them with fresh entry and stage names; 19 interfaces: props and public properties with their types, 16 components and 3 stacks), else 1.0"

[agent]
timeout_sec = 21600.0
user = "agent"
network_mode = "no-network"

[verifier]
timeout_sec = 2400.0
environment_mode = "separate"
network_mode = "no-network"
user = "root"

[verifier.environment]
build_timeout_sec = 1800.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
network_mode = "no-network"

[environment]
build_timeout_sec = 1800.0
memory_mb = 8192
cpus = 4
storage_mb = 20480
network_mode = "no-network"
workdir = "/workspace/accelerator-platform"
gpus = 0
mcp_servers = []
