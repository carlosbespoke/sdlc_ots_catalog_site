# A separate verifier, rebuilt from the same Dockerfile in its own container. Grading
# needs to see what the agent left behind, so the agent's working tree is collected and
# extracted there. Sharing the agent's container instead put the git history, the
# interpreter and the answer key all within its reach, and each one turned out to be a
# way of scoring without doing the work.
[verifier]
environment_mode = "separate"
timeout_sec = 6660.0
[[verifier.collect]]
command = "bash -c 'mkdir -p /logs/artifacts && cd /workspace/repo && tar czf /logs/artifacts/worktree.tgz --exclude=./.git . ; cp -f /app/rca.json /logs/artifacts/rca.json 2>/dev/null || true ; cp -f /app/RESEARCH_AND_PLANNING.md /logs/artifacts/RESEARCH_AND_PLANNING.md 2>/dev/null || true'"
service = "main"
timeout_sec = 300
# memory_mb was 4096 and is 8192. A pytest process was OOM killed at 2.09 GB inside a
# 4 GB container while falcon's 4253 test suite ran, and a process killed partway through
# collection reports a handful of tests and an error, which the reference solution gate
# reads as a task defect. It does not reproduce when the box is quiet, so it presents as a
# flaky gate. A limit is a cap and not a reservation, so raising it costs nothing on a
# repository that does not need it. The one interaction to know about: containers all run
# inside docker-limited.slice at MemoryMax=58G, so a high enough build concurrency can
# still reach the slice limit, and the answer there is fewer concurrent builds rather than
# a smaller per container cap.
[verifier.environment]
network_mode = "no-network"
build_timeout_sec = 1800.0
cpus = 2
memory_mb = 8192

[agent]
timeout_sec = 21600.0

[environment]
network_mode = "no-network"
build_timeout_sec = 1800.0
os = "linux"
workdir = "/workspace/repo"
cpus = 2
memory_mb = 8192
storage_mb = 20480
gpus = 0
