schema_version = "1.3"
artifacts = ["/logs/artifacts"]

[task]
name = "bespokelabsai/libexpat-realbug-a"
description = "A pinned checkout of libexpat misbehaves in four independent ways observable through the public C API. A parser created to handle external entity content never reports an amplification limit breach, no matter how low the activation threshold and maximum factor are set before it is fed a parameter entity declaration. A comment handler that suspends parsing from inside nested entity content causes the remainder of the outer entities' content to be silently dropped once parsing is resumed. Preparing to feed a next chunk whose length is near the upper limit of a signed integer, after an earlier non-final chunk, is accepted instead of being refused as out of memory. And a document whose declaration carries a version pseudo-attribute with nothing between the quotes is accepted rather than rejected. The task is to locate and repair each of these behaviours and name the function responsible for each."
authors = []
keywords = ["diagnosis", "root-cause", "real-bug", "c", "ctest"]

