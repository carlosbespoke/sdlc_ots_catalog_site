# Dual-container (separate) verifier, which the Voyager OTS spec requires of every task
# (2026-09-29). Grading runs in its OWN container, built from tests/Dockerfile: the same
# environment/Dockerfile the agent's image comes from, plus root-owned /tests layers the
# agent image never holds. Nothing the agent did at run time reaches that container except
# what the collect command below hands over - /logs/artifacts/worktree.tgz (the working
# tree without .git) and /logs/artifacts/rca.json - and tests/grade.py adopts only source
# files out of the archive. So the agent's .git, its venv, its home directory, its
# processes and anything it planted outside the source roots never meet the grader. The
# grader still runs as root (user below) and drops to the agent account for every suite run
# (answer_key run_tests_as = "agent"). No [verifier.environment] block: Harbor then gives
# the verifier a fresh copy of [environment] below, so one declaration governs both
# containers' network, cpus, memory and storage.
[verifier]
environment_mode = "separate"
user = "root"
timeout_sec = 4860.0
[[verifier.collect]]
command = "bash -c 'mkdir -p /logs/artifacts && cd /workspace/repo && tar czf /logs/artifacts/worktree.tgz --exclude=./.git . ; cp -f /app/rca.json /logs/artifacts/rca.json 2>/dev/null || true'"
service = "main"
timeout_sec = 300

# The solving agent's own budget, per language. Horizon applies it as written, with no
# multiplier. AGENT_TIMEOUT_SEC holds the numbers and the reason.
[agent]
timeout_sec = 21600.0

[environment]
network_mode = "no-network"
build_timeout_sec = 1800.0
os = "linux"
workdir = "/workspace/repo"
cpus = 2
memory_mb = 8192
storage_mb = 20480
gpus = 0
