schema_version = "1.4"

[[artifacts]]
source = "/workspace/platform"
exclude = [".terraform", ".git", "*.tfstate", "*.tfstate.backup", "*.tfplan", "crash.log"]

[metadata]
difficulty = "hard"
category = "Infrastructure as Code"
tags = ["iac", "terraform", "live-services", "access-model", "postgres", "vault", "postgresql", "healthcare", "adoption"]
expert_time_estimate_minutes = 300
display_description = "A healthcare platform's Vault and PostgreSQL were set up mostly by hand over two years; only a small phase 0 is in Terraform. Implement the approved access model with Terraform against the live services: adopt every hand-made policy, AppRole role, database connection and role, team group and PostgreSQL role, schema and grant, fix the drift, retire what the model retires, keep production clients working, and keep it all derived from the inventory."
source_repository = "self-authored (synthetic healthcare platform: Medlink)"
source_commit = "n/a"
source_license = "n/a (synthetic)"
task_type = "access_model"
backends = "postgres,vault"
terraform_version = "1.16.4"
grading = "live services: 0 if a gate fails (static rules, init/validate/apply as an unprivileged user against fresh services and the production state, clean second plan, every model object managed) or a core check fails (out-of-scope objects, data, production credentials the model keeps); else passed/643 behavioural checks (live observation compared with the reference, base and 4 inventory changes applied on top)"

[agent]
timeout_sec = 21600.0
user = "agent"
network_mode = "no-network"

[verifier]
timeout_sec = 3600.0
environment_mode = "separate"
network_mode = "no-network"
user = "root"

[verifier.environment]
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 8192
storage_mb = 10240
network_mode = "no-network"

[environment]
build_timeout_sec = 1800.0
memory_mb = 8192
cpus = 4
storage_mb = 20480
network_mode = "no-network"
workdir = "/workspace/platform"
gpus = 0
mcp_servers = []

# The platform services run as processes in the agent container; this gates the agent until they answer.
[environment.healthcheck]
command = "platform-up"
interval_sec = 5.0
timeout_sec = 120.0
start_period_sec = 5.0
start_interval_sec = 2.0
retries = 30
