description = "A Go service and library collection for reproducing upstream package artifacts has been altered by 18 one-line edits, and its test suite has been removed. Users report a broad spread of misbehaviour: bit-set queries answering for positions that were never touched, download URLs for containers, Alpine packages, Python wheels, Java artifacts and npm tarballs no longer resolving to package identifiers, successful HTTP metadata responses being reported as failures, a caching repository fetch failing end to end and answering the wrong status code on malformed queries, tarball unpacking silently dropping entries, user-supplied normalization rules being rejected and then having no effect, container invocation emitting a blank flag and mangling phase scripts, and operation identifiers that cannot be turned back into the records they name. The agent must locate the faults from behaviour alone, repair each one, and name the functions that were edited."
