schema_version = "1.1"
artifacts = ["/logs/artifacts/model.patch"]

[task]
name = "authored/pdk-cortex-parquet-reconvert-generations"
description = "Reconvert Cortex Parquet blocks into immutable reader-safe generations"
authors = []
keywords = ["go", "system-design"]

[metadata]
task_id = "pdk-cortex-parquet-reconvert-generations"
display_title = "Cortex immutable Parquet reconversion"
repository_url = "https://github.com/cortexproject/cortex.git"
base_commit_hash = "7f57b4129c61ce778616f75ae66ac09cf3bedd6a"
language = "go"
category = "system_design"

[verifier]
environment_mode = "separate"
# At least 3x one full grade (both suites) on 4 CPUs; hidden suites wait out real outages, and
# Horizon's graders are slower than a build sandbox.
timeout_sec = 5400.0

[[verifier.collect]]
command = "bash -lc 'cd /app && mkdir -p /logs/artifacts && git config --global --add safe.directory /app 2>/dev/null || true; git add -A 2>/dev/null || true; git diff --binary --cached 7f57b4129c61ce778616f75ae66ac09cf3bedd6a > /logs/artifacts/model.patch'"
service = "main"
timeout_sec = 60

[environment]
# Always false. A compose task attaches every service, main included, in both compose files to one
# network declared `internal: true`, so host names resolve but nothing reaches the internet.
allow_internet = false
build_timeout_sec = 5400.0
cpus = 4
memory_mb = 8192
storage_mb = 20480
gpus = 0

[agent]
# The solver runs unprivileged; the environment image keeps root as its default user. Multi-service
# work with real outages needs long test cycles, so the solver gets six hours.
user = "agent"
timeout_sec = 43200.0
