schema_version = "1.1"
artifacts = ["/logs/artifacts/model.patch"]

[task]
name = "authored/otel-late-resource-backfill"
description = "Reconcile late, reformatted and mis-scaled telemetry in the resource dimension, facts and inventory"
authors = []
keywords = ["python", "data-processing", "dbt"]

[metadata]
task_id = "otel-late-resource-backfill"
display_title = "Late telemetry resource reconciliation"
repository_url = "https://github.com/smithclay/dbt_opentelemetry.git"
base_commit_hash = "69c614f29e08fad188128971d551b76c25e6639c"
language = "sql"
category = "data_processing"
archetype = "dbt"

[verifier]
environment_mode = "separate"
# At least 3x one full grade (both suites) on 4 CPUs, and never below 1800.
timeout_sec = 1800

[[verifier.collect]]
command = "bash -lc 'cd /app && mkdir -p /logs/artifacts && git config --global --add safe.directory /app 2>/dev/null || true; git add -A 2>/dev/null || true; git diff --binary --cached 69c614f29e08fad188128971d551b76c25e6639c > /logs/artifacts/model.patch'"
service = "main"
timeout_sec = 60

[environment]
allow_internet = false
build_timeout_sec = 2400
cpus = 4
memory_mb = 8192
storage_mb = 20480
gpus = 0

[agent]
timeout_sec = 21600
