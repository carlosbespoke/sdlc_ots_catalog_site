schema_version = "1.1"
artifacts = ["/logs/artifacts/model.patch"]

[task]
name = "authored/dbt-unirate-dbt"
description = ""
authors = []
keywords = ["python", "data-processing", "dbt"]

[metadata]
task_id = "dbt-unirate-dbt"
display_title = "Cross rates and per-row currencies from a single-base rates file"
repository_url = "https://github.com/UniRate-API/dbt-unirate.git"
base_commit_hash = "aa03c2b92f0dc978f60cdbd5b2a32a155f909ae5"
language = "sql"
category = "data_processing"
archetype = "dbt"

[verifier]
environment_mode = "separate"
# At least 3x one full grade (both suites) on 4 CPUs, and never below 1800.
timeout_sec = 1800

[[verifier.collect]]
command = "bash -lc 'cd /app && mkdir -p /logs/artifacts && git config --global --add safe.directory /app 2>/dev/null || true; git add -A 2>/dev/null || true; git diff --binary --cached aa03c2b92f0dc978f60cdbd5b2a32a155f909ae5 > /logs/artifacts/model.patch'"
service = "main"
timeout_sec = 60

[environment]
allow_internet = false
build_timeout_sec = 2400
cpus = 4
memory_mb = 8192
storage_mb = 20480
gpus = 0

[agent]
timeout_sec = 21600
