schema_version = "1.1"
artifacts = ["/logs/artifacts/model.patch"]

[task]
name = "authored/pdk-schwifty-etl"
description = "Import the Bundesbank bank code file offline, resolving deleted bank codes to their successors"
authors = []
keywords = ["python", "data-processing", "etl"]

[metadata]
task_id = "pdk-schwifty-etl"
display_title = "Bundesbank bank code file: offline import and retired bank codes"
repository_url = "https://github.com/mdomke/schwifty.git"
base_commit_hash = "e40e32fdc99e42d222deb55a1dd350f18fb1cf1d"
language = "python"
category = "data_processing"
archetype = "etl"

[verifier]
environment_mode = "separate"
# At least 3x one full grade (both suites) on 4 CPUs, and never below 1800.
timeout_sec = 1800

[[verifier.collect]]
command = "bash -lc 'cd /app && mkdir -p /logs/artifacts && git config --global --add safe.directory /app 2>/dev/null || true; git add -A 2>/dev/null || true; git diff --binary --cached e40e32fdc99e42d222deb55a1dd350f18fb1cf1d > /logs/artifacts/model.patch'"
service = "main"
timeout_sec = 60

[environment]
allow_internet = false
build_timeout_sec = 2400
cpus = 4
memory_mb = 8192
storage_mb = 20480
gpus = 0

[agent]
timeout_sec = 21600
