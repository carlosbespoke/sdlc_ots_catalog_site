[task]
name = "authored/pdk-sqlite-history-json-schema"
description = ""
authors = []
keywords = ["python", "data-processing", "schema"]

[metadata]
task_id = "pdk-sqlite-history-json-schema"
display_title = "Repair audit history after tracked SQLite tables changed shape"
repository_url = "https://github.com/simonw/sqlite-history-json.git"
base_commit_hash = "53e66b2791a1ccc2efd19c1e24de9fd5afcc343b"
language = "python"
