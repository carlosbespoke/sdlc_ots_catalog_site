schema_version = "1.4"

[[artifacts]]
source = "/workspace/pulumi"
exclude = [".git", "__pycache__", ".venv", "venv", "node_modules", ".pulumi"]

[metadata]
difficulty = "hard"
category = "Infrastructure as Code"
tags = ["iac", "pulumi", "terraform", "typescript", "aws", "migrate"]
expert_time_estimate_minutes = 420
display_description = "Port a 198-resource, four-module Terraform AWS application platform (13 AWS services and three key maps) to a Pulumi TypeScript program whose imported production preview is clean and whose configuration, drift behavior, resources, and outputs remain Terraform-equivalent"
source_repository = "takakuni-classmethod/cats-vs-dogs"
source_commit = "75d0db50a6b3e311029e8074fcd4233e6c26fff4"
source_license = "MIT"
language = "typescript"
pulumi_version = "3.267.0"
pulumi_aws_version = "6.83.0"
terraform_version = "1.16.4"
aws_provider_version = "5.100.0"
grading = "1 if every gate and all 32 checks pass, else 0 (every scenario is required): the gates (the program must type-check with the owned tsconfig.json, run unprivileged and offline, plan no changes against the production stack and against a copy with every generated ID swapped, register no banned option or lookup, and export the Terraform outputs) and the checks (31 configuration changes and the drift revert, including configurations the statement does not show: adding or removing an availability zone, an application service or a private service integration; changing the settings of existing availability zones, application services or private service integrations; renaming the project or the environment; replace shared tags with dropped, added, and colliding keys; re-address the VPC and every subnet consistently; change VPC flow-log retention and aggregation; change KMS, repository, and DynamoDB settings; change service logging, queue retention, and health checks; change backlog and error alarm thresholds, periods, and evaluations; or reverting the drift); each check compares planned operations, planned resource state and stack outputs with the reference port of the Terraform configuration"

[agent]
timeout_sec = 21600.0
user = "agent"
network_mode = "no-network"

[verifier]
timeout_sec = 7200.0
environment_mode = "separate"
network_mode = "no-network"
user = "root"

[verifier.environment]
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 8192
storage_mb = 10240
network_mode = "no-network"

[environment]
build_timeout_sec = 1800.0
memory_mb = 8192
cpus = 4
storage_mb = 20480
network_mode = "no-network"
workdir = "/workspace/pulumi"
gpus = 0
mcp_servers = []
