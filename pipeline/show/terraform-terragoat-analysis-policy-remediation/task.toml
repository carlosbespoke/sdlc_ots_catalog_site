schema_version = "1.4"

[[artifacts]]
source = "/workspace/infra"
exclude = [".terraform", ".git", "*.tfstate", "*.tfstate.backup", "*.tfplan"]

[metadata]
difficulty = "hard"
category = "Infrastructure as Code"
tags = ["iac", "terraform", "aws", "policy-as-code", "opa", "conftest", "remediation"]
expert_time_estimate_minutes = 360
display_description = "Remediate a 192-resource production Terraform AWS stack against a 45-rule OPA/conftest pack with roughly 250 current failures, using only in-place updates and approved creates while preserving collection-wide behavior for analysis services and availability zones and input-driven network and log settings"
source_repository = "faahmed77/terragoat"
source_commit = "de484aa5a1a84f929d919264f3af45f21759788d"
source_license = "Apache-2.0"
terraform_version = "1.16.4"
aws_provider_version = "5.100.0"
grading = "binary: 1 only when every gate (static bans and protected files, offline init/validate/plan against the verifier's pristine state, in-place updates only, allowed new resource types, allowed update arguments, unchanged variables, the verifier's own copy of the policy pack) and all 12 generality probes pass, else 0"

[agent]
timeout_sec = 21600.0
user = "agent"
network_mode = "no-network"

[verifier]
timeout_sec = 3600.0
environment_mode = "separate"
network_mode = "no-network"
user = "root"

[verifier.environment]
build_timeout_sec = 1800.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
network_mode = "no-network"

[environment]
build_timeout_sec = 1800.0
memory_mb = 8192
cpus = 4
storage_mb = 20480
network_mode = "no-network"
workdir = "/workspace/infra"
gpus = 0
mcp_servers = []
